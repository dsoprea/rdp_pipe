[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdp_pipe"
version = "0.0.1"
description = "PyQt6 desktop RDP client with seamless resize (MS-RDPEDISP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aardwolf",
    "PyQt6",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
rdp = "rdp_pipe.entrypoint.rdp:main"
rdpr = "rdp_pipe.entrypoint.rdpr:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
